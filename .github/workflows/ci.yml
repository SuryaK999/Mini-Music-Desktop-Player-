name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            build-args: --win
            artifact-name: serene-player-windows
            artifact-path: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            platform: macOS
            build-args: --mac
            artifact-name: serene-player-macos
            artifact-path: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
          - os: ubuntu-latest
            platform: Linux
            build-args: --linux
            artifact-name: serene-player-linux
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Enable Windows Developer Mode
        if: runner.os == 'Windows'
        run: |
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWORD -Force

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Syntax Verification
        run: npm test

      - name: Build Electron App (Dry Run)
        run: npx electron-builder ${{ matrix.build-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Test Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: ignore
