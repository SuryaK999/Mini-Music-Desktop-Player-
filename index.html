<!DOCTYPE html>
<html class="theme-rgb">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:;">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <header class="titlebar">
            <div class="brand-wrapper">
                <span class="brand-title">❤𝓜𝓘𝓝𝓘 𝓟𝓛𝓐𝓨𝓔𝓡</span>
                <div class="eq-visualizer">
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                </div>
            </div>
            <div class="win-controls">
                <button class="win-btn" id="min-btn">&#65123;</button>
                <button class="win-btn" id="close-btn">&#10006;</button>
            </div>
        </header>
        <button id="queue-btn" class="btn-mini queue-btn-floating" title="View Queue">
            <svg class="icon-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="4" x2="19" y2="4" />
                <line x1="5" y1="8" x2="19" y2="8" />
                <rect x="3" y="12" width="18" height="9" rx="1.5" />
                <polygon points="10 14.5 10 18.5 14 16.5" fill="currentColor" />
            </svg>
        </button>
        <main style="text-align: center;">
            <div class="album-zone">
                <div class="disc-vinyl" id="disc-art">
                    <img src="assets/disc2.png">
                    <div class="vinyl-grooves"></div>
                    <div class="vinyl-gloss"></div>
                </div>
            </div>
            <div class="info-hub">
                <h2 id="track-name">𝓜𝓤𝓢𝓘𝓒</h2>
                <div class="artist-row">
                    <span id="artist-name">𝓢𝔂𝓼𝓽𝓮𝓶 𝓡𝓮𝓪𝓭𝔂</span>
                    <span id="track-counter"></span>
                </div>
            </div>
            <div class="progress-container">
                <div class="bar-bg" id="seek-bar">
                    <div id="seek-fill"></div>
                </div>
                <div class="time-stamp">
                    <span id="current-time">00:00</span>
                    <span id="total-time">00:00</span>
                </div>
            </div>
            <div class="controls-row">
                <button id="add-btn" class="btn-main">＋</button>
                <button id="prev" class="btn-main">⏮</button>
                <button id="play">𝓟𝓵𝓪𝔂</button>
                <button id="next" class="btn-main">⏭</button>
                <button id="theme-toggle" class="btn-main">&#9728;</button> 
            </div>
            <div class="volume-dock">
                <span style="font-size: 10px; font-weight: 900; color: var(--text);"><b>𝓥𝓸𝓵𝓾𝓶𝓮</b></span>
                <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </main>
        <!-- Dynamic Slide-Up Playlist Drawer -->
        <div class="playlist-drawer" id="playlist-drawer">
            <div class="drawer-header">
                <div class="drawer-title-container">
                    <svg class="icon-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="4" x2="19" y2="4" />
                        <line x1="5" y1="8" x2="19" y2="8" />
                        <rect x="3" y="12" width="18" height="9" rx="1.5" />
                        <polygon points="10 14.5 10 18.5 14 16.5" fill="currentColor" />
                    </svg>
                    <span class="drawer-title">𝓠𝓾𝓮𝓾𝓮</span>
                </div>
                <button class="close-drawer" id="close-drawer-btn">✖</button>
            </div>
            <div class="drawer-content" id="drawer-list">
                <!-- Queue items loaded dynamically -->
            </div>
        </div>
    </div>
    <audio id="main-audio"></audio>
    <script src="renderer.js"></script>
</body>
</html>
